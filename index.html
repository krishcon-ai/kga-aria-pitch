<style>
:root {
  --navy:    #0A1628;
  --navy2:   #0D1F3C;
  --navy3:   #1B3A6B;
  --gold:    #C9A84C;

  --gold-lt: #F5EDD4;
  --ivory:   #F7F5F0;
  --white:   #FFFFFF;

  --billing: #BF360C;

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#1C1C2E; color:#1A1A2E; overflow-x:hidden; }

/* ── CHROME ─────────────────────────────────── */
#chrome {
  background: linear-gradient(180deg,#0A1628,#0D2040);
  border-bottom: 3px solid var(--gold);
  padding: 14px 28px;

  position: sticky; top:0; z-index:100;
}
#chrome .logo { display:flex; align-items:center; gap:10px; }
#chrome .logo-mark { width:32px; height:32px; background:var(--gold); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Montserrat',sans-serif; font-weight:900; font-size:16px; color:var(--navy); flex-shrink:0; }
#chrome .logo-text { font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; color:#fff; }
#chrome .logo-sub { font-family:'Montserrat',sans-serif; font-size:8px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.35); }
#chrome .divider { width:1px; height:28px; background:rgba(255,255,255,.1); }
#chrome .deck-title { font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600; color:rgba(255,255,255,.5); }
#chrome .badge { background:rgba(201,168,76,.15); border:1px solid rgba(201,168,76,.35); border-radius:4px; padding:3px 10px; font-family:'Montserrat',sans-serif; font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--gold); }
#chrome .btn-group { margin-left:auto; display:flex; gap:8px; }
.btn { height:30px; padding:0 14px; border-radius:6px; font-family:'Montserrat',sans-serif; font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; border:none; transition:all .2s; }
.btn-outline { background:transparent; border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.6); }
.btn-outline:hover { border-color:var(--gold); color:var(--gold); }
.btn-gold { background:var(--gold); color:var(--navy); }
.btn-gold:hover { background:#D4B558; }

/* ── GALLERY VIEW ────────────────────────────── */
#gallery { padding:28px 32px; display:flex; flex-direction:column; gap:12px; }
.section-label { font-family:'Montserrat',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.2); padding:16px 0 6px; border-top:1px solid rgba(255,255,255,.06); margin-top:8px; display:flex; align-items:center; gap:12px; }
.section-label:first-child { border-top:none; margin-top:0; }
.gallery-row { display:flex; gap:14px; flex-wrap:wrap; }
.thumb-wrap { cursor:pointer; }
.thumb-wrap:hover .slide-preview { transform:scale(1.02); box-shadow:0 8px 32px rgba(0,0,0,.4), 0 0 0 2px var(--gold); }
.slide-preview { border-radius:8px; overflow:hidden; transition:all .2s; box-shadow:0 4px 16px rgba(0,0,0,.3); }
.slide-num { font-family:'Montserrat',sans-serif; font-size:9px; font-weight:600; color:rgba(255,255,255,.3); text-align:center; margin-top:5px; }
.slide-type { font-size:8px; color:rgba(255,255,255,.2); text-align:center; }

/* ── PRESENT VIEW ────────────────────────────── */
#present { display:none; position:fixed; inset:0; background:#000; z-index:200; flex-direction:column; align-items:center; justify-content:center; }
#present.active { display:flex; }
#present-stage { position:relative; }
#nav-prev, #nav-next { position:fixed; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); color:rgba(255,255,255,.7); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; z-index:201; }
#nav-prev:hover, #nav-next:hover { border-color:var(--gold); color:var(--gold); background:rgba(201,168,76,.1); }
#nav-prev { left:20px; }
#nav-next { right:20px; }
#nav-close { position:fixed; top:16px; right:16px; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.6); color:rgba(255,255,255,.6); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:201; }
#nav-close:hover { border-color:#f66; color:#f66; }
#slide-counter { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font-family:'Montserrat',sans-serif; font-size:10px; font-weight:600; color:rgba(255,255,255,.3); letter-spacing:2px; z-index:201; }
#slide-dots { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:201; }
.dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.2); cursor:pointer; transition:.2s; }
.dot.active { background:var(--gold); }

/* ── SLIDE BASE STYLES ───────────────────────── */
.slide { width:var(--slide-w); height:var(--slide-h); position:relative; overflow:hidden; flex-shrink:0; }
.slide *, .slide *::before, .slide *::after { box-sizing:border-box; }

/* Scale for thumbnails */
.thumb-wrap .slide { transform-origin: top left; }

/* ── DARK SLIDE BASE ─────────────────────────── */
.s-dark {
  background: linear-gradient(150deg, var(--navy) 0%, var(--navy2) 100%);
}
.s-dark .left-bar { position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg, var(--gold), var(--gold-dk)); }
.s-dark .grid-tex {
  position:absolute; inset:0;
  background-image: linear-gradient(rgba(201,168,76,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(201,168,76,.03) 1px, transparent 1px);
  background-size: 48px 48px;
}
.s-dark .slide-footer { position:absolute; bottom:0; left:0; right:0; padding:10px 36px 14px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(201,168,76,.12); }
.s-dark .slide-footer .f-left { font-family:'Montserrat',sans-serif; font-size:7px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.2); }
.s-dark .slide-footer .f-right { font-family:'Montserrat',sans-serif; font-size:7px; color:rgba(255,255,255,.15); }

/* ── LIGHT SLIDE BASE ────────────────────────── */
.s-light { background:var(--ivory); }
.s-light .top-rule { position:absolute; top:0; left:0; right:0; height:5px; background:var(--navy); }
.s-light .top-rule::after { content:''; position:absolute; right:0; top:0; bottom:0; width:64px; background:var(--gold); }
.s-light .slide-header { position:absolute; top:5px; left:0; right:0; padding:12px 40px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--ivory); }
.s-light .slide-header .s-eyebrow { font-family:'Montserrat',sans-serif; font-size:7.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dk); }
.s-light .slide-header .s-title { font-family:'Montserrat',sans-serif; font-size:14px; font-weight:800; color:var(--navy); }
.s-light .slide-header .s-logo { display:flex; align-items:center; gap:6px; }
.s-light .slide-header .s-logo-k { width:20px; height:20px; background:var(--navy); border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:'Montserrat',sans-serif; font-weight:900; font-size:10px; color:var(--gold); }
.s-light .slide-header .s-logo-name { font-family:'Montserrat',sans-serif; font-size:8px; font-weight:700; color:var(--navy); }
.s-light .content { position:absolute; top:60px; left:40px; right:40px; bottom:42px; }
.s-light .slide-footer { position:absolute; bottom:0; left:0; right:0; padding:8px 40px 10px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); background:var(--ivory); }
.s-light .slide-footer .f-company { font-family:'Montserrat',sans-serif; font-size:7px; font-weight:500; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.s-light .slide-footer .f-num { font-family:'Montserrat',sans-serif; font-size:7px; color:var(--gold-dk); font-weight:600; }
.s-light .slide-footer .f-conf { font-family:'Montserrat',sans-serif; font-size:7px; color:var(--muted); }

/* ── TYPOGRAPHY UTILITIES ────────────────────── */
.t-eyebrow { font-family:'Montserrat',sans-serif; font-size:8px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
.t-eyebrow-dk { font-family:'Montserrat',sans-serif; font-size:8px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-dk); }

.t-body { font-family:'Inter',sans-serif; font-size:11px; font-weight:400; color:var(--mid); line-height:1.7; }
.t-body-sm { font-family:'Inter',sans-serif; font-size:10px; color:var(--mid); line-height:1.65; }
.t-caption { font-family:'Montserrat',sans-serif; font-size:7.5px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
.t-stat { font-family:'Montserrat',sans-serif; font-size:32px; font-weight:800; color:var(--navy); }
.t-stat-unit { font-family:'Inter',sans-serif; font-size:14px; font-weight:500; color:var(--muted); }
.gold-line { width:36px; height:3px; background:linear-gradient(90deg, var(--gold), var(--gold-dk)); margin-top:14px; border-radius:2px; }

</style>
</head>

/* ── GALLERY BUILDER ───────────────────────────────── */
const THUMB_SCALE = 0.28;
const gallery = document.getElementById('gallery');
let currentSection = '';
let rowEl = null;

SLIDES.forEach((slide, i) => {
  if (slide.section !== currentSection) {
    currentSection = slide.section;
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.innerHTML = `<span style="white-space:nowrap">— ${slide.section.toUpperCase()} —</span>`;
    gallery.appendChild(lbl);
    rowEl = document.createElement('div');
    rowEl.className = 'gallery-row';
    gallery.appendChild(rowEl);
  }
  const wrap = document.createElement('div');
  wrap.className = 'thumb-wrap';
  wrap.onclick = () => enterPresent(i);
  const slideEl = document.createElement('div');
  slideEl.className = 'slide-preview';
  slideEl.style.width = (960 * THUMB_SCALE) + 'px';
  slideEl.style.height = (540 * THUMB_SCALE) + 'px';
  slideEl.innerHTML = `<div style="transform:scale(${THUMB_SCALE});transform-origin:top left;width:960px;height:540px;">${slide.html}</div>`;
  const num = document.createElement('div'); num.className='slide-num'; num.textContent=`${String(i+1).padStart(2,'0')}`;
  const typ = document.createElement('div'); typ.className='slide-type'; typ.textContent=slide.type;
  wrap.appendChild(slideEl); wrap.appendChild(num); wrap.appendChild(typ);
  rowEl.appendChild(wrap);
});

/* ── PRESENTATION ENGINE ────────────────────────────── */
let currentIdx = 0;
const presentEl = document.getElementById('present');
const stageEl = document.getElementById('present-stage');
const counterEl = document.getElementById('slide-counter');
const dotsEl = document.getElementById('slide-dots');

function enterPresent(idx=0) {
  currentIdx = idx;
  dotsEl.innerHTML = SLIDES.map((_,i)=>`<div class="dot ${i===0?'active':''}" onclick="goSlide(${i})"></div>`).join('');
  presentEl.classList.add('active');
  document.body.style.overflow='hidden';
  renderSlide();
}
function exitPresent() {
  presentEl.classList.remove('active');
  document.body.style.overflow='';
}
function renderSlide() {
  const maxW = Math.min(window.innerWidth - 120, window.innerHeight * 16/9 - 80);
  const scale = maxW / 960;
  stageEl.style.width = (960*scale)+'px';
  stageEl.style.height = (540*scale)+'px';
  stageEl.innerHTML = `<div style="transform:scale(${scale});transform-origin:top left;width:960px;height:540px;">${SLIDES[currentIdx].html}</div>`;
  counterEl.textContent = `${currentIdx+1} / ${SLIDES.length}`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===currentIdx));
}
function nextSlide() { if(currentIdx<SLIDES.length-1){currentIdx++;renderSlide();} }
function prevSlide() { if(currentIdx>0){currentIdx--;renderSlide();} }
function goSlide(i) { currentIdx=i; renderSlide(); }

document.addEventListener('keydown', e => {
  if(!presentEl.classList.contains('active')) return;
  if(e.key==='ArrowRight'||e.key==='Space') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') exitPresent();
});
window.addEventListener('resize', () => { if(presentEl.classList.contains('active')) renderSlide(); });

</script>

<!-- PRINT STYLES -->

  #chrome, #present { display:none!important; }
  body { background:#fff; }

  .gallery-row { display:block; }
  .thumb-wrap { page-break-after:always; margin:0; padding:0; cursor:default; }
  .thumb-wrap .slide-preview { border-radius:0!important; box-shadow:none!important; }
  .slide-num, .slide-type { display:none; }
  /* Print full size */
  .thumb-wrap .slide-preview { width:100vw!important; height:calc(100vw * 9/16)!important; }
  .thumb-wrap .slide-preview > div { transform:scale(1)!important; width:100vw!important; height:calc(100vw * 9/16)!important; }
  .thumb-wrap:hover .slide-preview { transform:none!important; box-shadow:none!important; }
}
</style>
